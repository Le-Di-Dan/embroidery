# Development stack for the Embroidery Commerce Platform.
# Use the root wrapper scripts (they resolve this file and the root .env):
#
#   Full stack (gateway entrypoint):  pnpm docker:dev:up
#   Infrastructure only:              pnpm docker:dev:up postgres
#   Direct app ports (debug):         pnpm docker:debug:up
#   Quality tooling (SonarQube):      pnpm docker:quality:up
#
# Values default to the development credentials documented in .env.example.
# Real secrets never live in this file.

name: embroidery-dev

services:
  # Edge gateway — the only public browser entrypoint in normal mode (D-036).
  # Direct application ports are exposed only via docker-compose.debug.yml.
  gateway:
    image: nginx:1.27.3-alpine
    ports:
      - '${GATEWAY_HTTP_PORT:-80}:8080'
    environment:
      # Public client-facing port, rendered into X-Forwarded-Port — must match
      # the host side of the port mapping above.
      GATEWAY_HTTP_PORT: ${GATEWAY_HTTP_PORT:-80}
      STOREFRONT_HOST: ${STOREFRONT_HOST:-embroidery.local}
      ADMIN_HOST: ${ADMIN_HOST:-admin.embroidery.local}
      GATEWAY_CLIENT_MAX_BODY_SIZE: ${GATEWAY_CLIENT_MAX_BODY_SIZE:-20m}
      GATEWAY_PROXY_CONNECT_TIMEOUT: ${GATEWAY_PROXY_CONNECT_TIMEOUT:-10s}
      GATEWAY_PROXY_READ_TIMEOUT: ${GATEWAY_PROXY_READ_TIMEOUT:-60s}
      GATEWAY_PROXY_SEND_TIMEOUT: ${GATEWAY_PROXY_SEND_TIMEOUT:-60s}
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/templates:/etc/nginx/templates:ro
    depends_on:
      storefront:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/gateway/healthz']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - embroidery
    restart: unless-stopped

  storefront:
    build:
      context: ../..
      dockerfile: infrastructure/docker/storefront.Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      # Browser calls the same-origin gateway path; never a direct host:port.
      NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/api}
      # Server Components call the internal service URL (never in the client bundle).
      INTERNAL_API_BASE_URL: http://api:4000/api
      # Bind-mounted sources need polling for reliable change detection on Windows/macOS hosts.
      WATCHPACK_POLLING: 'true'
    volumes:
      - ../../apps/storefront/src:/app/apps/storefront/src
      - ../../packages/contracts/src:/app/packages/contracts/src
      - ../../packages/api-client/src:/app/packages/api-client/src
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - embroidery
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/admin.Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/api}
      INTERNAL_API_BASE_URL: http://api:4000/api
      WATCHPACK_POLLING: 'true'
    volumes:
      - ../../apps/admin/src:/app/apps/admin/src
      - ../../packages/contracts/src:/app/packages/contracts/src
      - ../../packages/api-client/src:/app/packages/api-client/src
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/healthz']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - embroidery
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      API_PORT: '4000'
      CHOKIDAR_USEPOLLING: 'true'
      TSC_WATCHFILE: DynamicPriorityPolling
    volumes:
      - ../../apps/api/src:/app/apps/api/src
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - embroidery
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      TSC_WATCHFILE: DynamicPriorityPolling
    volumes:
      - ../../apps/worker/src:/app/apps/worker/src
    networks:
      - embroidery
    restart: unless-stopped

  postgres:
    # Exact reviewed patch (ADR-DB1-001, DEV-DB6-002). Never a floating tag:
    # `postgres:16` would let machines drift onto different patches.
    # Digest: sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-embroidery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-embroidery_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-embroidery}
      # C collation is the documented baseline (ADR-DB1-001, DEV-DB6-001):
      # technical identifiers compare bytewise, independent of the image's
      # locale library. The stock image would default to en_US.utf8 and build
      # every text index under it silently. ICU stays available for an explicit
      # COLLATE "vi-x-icu" clause when Vietnamese sort is needed.
      # NOTE: initdb runs ONCE per volume — changing this needs a volume reset.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to loopback only — the database is never exposed publicly.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - embroidery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - embroidery
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10.7.0-community
    profiles: ['quality']
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonar_dev_password}
    ports:
      - '127.0.0.1:${SONARQUBE_PORT:-9000}:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - quality
    restart: unless-stopped

  sonarqube-db:
    image: postgres:15.8-alpine
    profiles: ['quality']
    environment:
      POSTGRES_USER: ${SONARQUBE_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonar_dev_password}
      POSTGRES_DB: ${SONARQUBE_DB_NAME:-sonar}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - quality
    restart: unless-stopped

networks:
  embroidery:
    name: embroidery-dev
  quality:
    name: embroidery-quality

volumes:
  embroidery_postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db_data:
