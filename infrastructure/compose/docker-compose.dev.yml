# Development stack for the Embroidery Commerce Platform.
# Use the root wrapper scripts (they resolve this file and the root .env):
#
#   Full stack (gateway entrypoint):  pnpm docker:dev:up
#   Infrastructure only:              pnpm docker:dev:up postgres
#   Direct app ports (debug):         pnpm docker:debug:up
#   Quality tooling (SonarQube):      pnpm docker:quality:up
#
# Values default to the development credentials documented in .env.example.
# Real secrets never live in this file.

name: embroidery-dev

# Object-storage configuration for every service that builds the Nest AppModule
# (ADR-APP2-001, APP2-I01). The asset providers read `process.env` once at
# provider construction, so a container that boots AppModule without these
# fails at startup rather than on the first upload. Defaults mirror
# `.env.example`; the endpoint is the compose-network MinIO, never a host port.
x-object-storage-env: &object-storage-env
  OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-s3}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
  OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-embroidery_minio_dev}
  OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-embroidery_minio_dev_password}
  OBJECT_STORAGE_ORIGINALS_BUCKET: ${OBJECT_STORAGE_ORIGINALS_BUCKET:-embroidery-dev-originals}
  OBJECT_STORAGE_DERIVATIVES_BUCKET: ${OBJECT_STORAGE_DERIVATIVES_BUCKET:-embroidery-dev-derivatives}

services:
  # Edge gateway — the only public browser entrypoint in normal mode (D-036).
  # Direct application ports are exposed only via docker-compose.debug.yml.
  gateway:
    image: nginx:1.27.3-alpine
    ports:
      - '${GATEWAY_HTTP_PORT:-80}:8080'
    environment:
      # Public client-facing port, rendered into X-Forwarded-Port — must match
      # the host side of the port mapping above.
      GATEWAY_HTTP_PORT: ${GATEWAY_HTTP_PORT:-80}
      STOREFRONT_HOST: ${STOREFRONT_HOST:-embroidery.local}
      ADMIN_HOST: ${ADMIN_HOST:-admin.embroidery.local}
      GATEWAY_CLIENT_MAX_BODY_SIZE: ${GATEWAY_CLIENT_MAX_BODY_SIZE:-20m}
      GATEWAY_PROXY_CONNECT_TIMEOUT: ${GATEWAY_PROXY_CONNECT_TIMEOUT:-10s}
      GATEWAY_PROXY_READ_TIMEOUT: ${GATEWAY_PROXY_READ_TIMEOUT:-60s}
      GATEWAY_PROXY_SEND_TIMEOUT: ${GATEWAY_PROXY_SEND_TIMEOUT:-60s}
      GATEWAY_UPLOAD_MAX_BODY_SIZE: ${GATEWAY_UPLOAD_MAX_BODY_SIZE:-27m}
      GATEWAY_UPLOAD_PROXY_TIMEOUT: ${GATEWAY_UPLOAD_PROXY_TIMEOUT:-360s}
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/templates:/etc/nginx/templates:ro
    depends_on:
      storefront:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/gateway/healthz']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - embroidery
    restart: unless-stopped

  storefront:
    build:
      context: ../..
      dockerfile: infrastructure/docker/storefront.Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      # Browser calls the same-origin gateway path; never a direct host:port.
      NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/api}
      # Server Components call the internal service URL (never in the client bundle).
      INTERNAL_API_BASE_URL: http://api:4000/api
      # Bind-mounted sources need polling for reliable change detection on Windows/macOS hosts.
      WATCHPACK_POLLING: 'true'
    volumes:
      - ../../apps/storefront/src:/app/apps/storefront/src
      - ../../packages/contracts/src:/app/packages/contracts/src
      - ../../packages/api-client/src:/app/packages/api-client/src
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - embroidery
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/admin.Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/api}
      INTERNAL_API_BASE_URL: http://api:4000/api
      # Browser reaches the app through this gateway host, not localhost; the dev
      # server must allow-list it so `/_next/*` (HMR) is served and the client
      # hydrates (APP1-A01-C1).
      ADMIN_HOST: ${ADMIN_HOST:-admin.embroidery.local}
      WATCHPACK_POLLING: 'true'
    volumes:
      - ../../apps/admin/src:/app/apps/admin/src
      - ../../packages/contracts/src:/app/packages/contracts/src
      - ../../packages/api-client/src:/app/packages/api-client/src
    depends_on:
      # The public Admin must not be advertised ready until a bootstrap admin
      # exists (or was intentionally skipped in production). A development
      # missing-env failure fails this dependency and keeps the stack un-ready.
      staff-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/healthz']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - embroidery
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
      target: dev
    environment:
      <<: *object-storage-env
      NODE_ENV: development
      API_PORT: '4000'
      # Reach the database over the compose network (never the host mapping).
      DATABASE_URL: postgres://${POSTGRES_USER:-embroidery}:${POSTGRES_PASSWORD:-embroidery_dev_password}@postgres:5432/${POSTGRES_DB:-embroidery}
      # Browser staff-session mutations arrive with the gateway Origin; it must be
      # allow-listed or login/logout are rejected with 403 (ADR-APP1-001 §6).
      STAFF_ALLOWED_ORIGINS: ${STAFF_ALLOWED_ORIGINS:-http://admin.embroidery.local}
      # Dev over plain HTTP: the session cookie cannot be Secure, so use the
      # unprefixed cookie name (the __Host- prefix requires Secure).
      STAFF_SESSION_COOKIE_SECURE: ${STAFF_SESSION_COOKIE_SECURE:-false}
      CHOKIDAR_USEPOLLING: 'true'
      TSC_WATCHFILE: DynamicPriorityPolling
    depends_on:
      postgres:
        condition: service_healthy
      # Serve requests only against a migrated schema.
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - ../../apps/api/src:/app/apps/api/src
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - embroidery
    restart: unless-stopped

  # One-shot: apply the canonical forward-only migrations, then exit. Owns no
  # port and is never routed through the gateway. Reuses the API image so it
  # runs the same committed migration tooling (@embroidery/database).
  db-migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-embroidery}:${POSTGRES_PASSWORD:-embroidery_dev_password}@postgres:5432/${POSTGRES_DB:-embroidery}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', '--filter', '@embroidery/database', 'db:migrate']
    restart: 'no'
    networks:
      - embroidery

  # One-shot: idempotently create OR reuse the development admin, then exit.
  # Runs on every `up` after migrations; reuses the API image and the canonical
  # staff-bootstrap CLI (ADR-APP1-001 §8). Development requires all three
  # STAFF_BOOTSTRAP_* variables (a missing value fails this service and keeps the
  # stack un-ready); production skips (exit 0) when they are absent. Owns no port
  # and is never exposed through the gateway. Never prints the password.
  staff-bootstrap:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
      target: dev
    environment:
      # This CLI creates a full Nest application context from AppModule, so it
      # instantiates the asset providers and needs the same storage config.
      <<: *object-storage-env
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-embroidery}:${POSTGRES_PASSWORD:-embroidery_dev_password}@postgres:5432/${POSTGRES_DB:-embroidery}
      STAFF_BOOTSTRAP_EMAIL: ${STAFF_BOOTSTRAP_EMAIL:-}
      STAFF_BOOTSTRAP_PASSWORD: ${STAFF_BOOTSTRAP_PASSWORD:-}
      STAFF_BOOTSTRAP_DISPLAY_NAME: ${STAFF_BOOTSTRAP_DISPLAY_NAME:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    command: ['pnpm', '--filter', '@embroidery/api', 'staff:bootstrap']
    restart: 'no'
    networks:
      - embroidery

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      # Reach the database over the compose network (never the host mapping).
      DATABASE_URL: postgres://${POSTGRES_USER:-embroidery}:${POSTGRES_PASSWORD:-embroidery_dev_password}@postgres:5432/${POSTGRES_DB:-embroidery}
      CHOKIDAR_USEPOLLING: 'true'
      TSC_WATCHFILE: DynamicPriorityPolling
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps/worker/src:/app/apps/worker/src
    networks:
      - embroidery
    restart: unless-stopped

  postgres:
    # Exact reviewed patch (ADR-DB1-001, DEV-DB6-002). Never a floating tag:
    # `postgres:16` would let machines drift onto different patches.
    # Digest: sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-embroidery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-embroidery_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-embroidery}
      # C collation is the documented baseline (ADR-DB1-001, DEV-DB6-001):
      # technical identifiers compare bytewise, independent of the image's
      # locale library. The stock image would default to en_US.utf8 and build
      # every text index under it silently. ICU stays available for an explicit
      # COLLATE "vi-x-icu" clause when Vietnamese sort is needed.
      # NOTE: initdb runs ONCE per volume — changing this needs a volume reset.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to loopback only — the database is never exposed publicly.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - embroidery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - embroidery
    restart: unless-stopped

  # S3-compatible object storage for development (ADR-APP2-001, APP2-I01).
  # Exact reviewed release, never a floating `:latest`: an S3-compatible store
  # changes behaviour between releases, and the contract suite pins this same
  # image so development and tests agree.
  #
  # Deliberately publishes NO host port. Nothing on the host needs it: the API
  # and worker reach it as `minio:9000` over the compose network, and the
  # contract suite starts its own disposable container on a random loopback
  # port. Not publishing keeps the store unreachable from outside Docker.
  #
  # `server /data` is the image's own required subcommand, not a project
  # startup step — `pnpm docker:dev:up` remains the only command a developer
  # runs. Buckets are created by the application through
  # `@embroidery/object-storage` bootstrap; there is no `mc` sidecar.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: ['server', '/data']
    environment:
      # Development-only credentials from .env; MinIO serves nothing
      # anonymously, and no bucket policy is ever applied (ADR-APP2-001 §4.3).
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:-embroidery_minio_dev}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-embroidery_minio_dev_password}
    volumes:
      - embroidery_minio_data:/data
    healthcheck:
      # Official readiness probe. It is unauthenticated by design and reports
      # only liveness — it exposes no bucket or object data.
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - embroidery
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10.7.0-community
    profiles: ['quality']
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonar_dev_password}
    ports:
      - '127.0.0.1:${SONARQUBE_PORT:-9000}:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - quality
    restart: unless-stopped

  sonarqube-db:
    image: postgres:15.8-alpine
    profiles: ['quality']
    environment:
      POSTGRES_USER: ${SONARQUBE_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonar_dev_password}
      POSTGRES_DB: ${SONARQUBE_DB_NAME:-sonar}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - quality
    restart: unless-stopped

networks:
  embroidery:
    name: embroidery-dev
  quality:
    name: embroidery-quality

volumes:
  embroidery_postgres_data:
  embroidery_minio_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db_data:
