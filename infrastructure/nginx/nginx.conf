# Main Nginx configuration for the development edge gateway (D-036).
# Server/routing blocks live in conf.d, rendered from templates/ by the
# official image entrypoint (envsubst on *.template files).

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Correlate gateway access logs with upstream requests via the request id.
    log_format gateway '$remote_addr - [$time_local] "$request" $status '
                       '$body_bytes_sent "$http_referer" host="$host" '
                       'request_id=$effective_request_id upstream=$upstream_addr '
                       'upstream_status=$upstream_status';
    access_log /var/log/nginx/access.log gateway;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
