# Disposable PostgreSQL for staging proof only. See README.md — this is NOT
# production topology and is not durable.
apiVersion: v1
kind: Service
metadata:
  name: embroidery-postgres
  labels: { app.kubernetes.io/component: postgres, embroidery.local/disposable: 'true' }
spec:
  selector: { app.kubernetes.io/component: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embroidery-postgres
  labels: { app.kubernetes.io/component: postgres, embroidery.local/disposable: 'true' }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: postgres } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app.kubernetes.io/component: postgres, embroidery.local/disposable: 'true' }
    spec:
      containers:
        - name: postgres
          # The exact reviewed patch the development stack pins (ADR-DB1-001),
          # so staging and development cannot drift onto different engines.
          image: postgres:16.14-alpine
          # TLS is on, with a per-run self-signed certificate, because the
          # application refuses to run otherwise — and refusing is correct.
          # `assertProductionSafety` rejects `DATABASE_SSL_MODE=disable` whenever
          # `NODE_ENV=production`, and staging runs production-mode images by
          # definition. Turning the guard off for staging would have proved a
          # configuration production can never use; giving the disposable server
          # a certificate proves the one it does.
          args:
            - '-c'
            - 'ssl=on'
            - '-c'
            - 'ssl_cert_file=/etc/postgres-tls/tls.crt'
            - '-c'
            - 'ssl_key_file=/etc/postgres-tls/tls.key'
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            # `--locale=C --encoding=UTF8` is the documented baseline
            # (ADR-DB1-001): technical identifiers compare bytewise, independent
            # of the image's locale library. `assertDatabaseBaseline` checks it,
            # so a staging database initialised without it fails the migration
            # Job rather than building every text index under the wrong rules.
            - { name: POSTGRES_INITDB_ARGS, value: '--locale=C --encoding=UTF8' }
            # Named with the harness's disposable prefix on purpose. The
            # canonical fixture authority (`packages/e2e-testing/support/app12/*`)
            # refuses to seed commercial data into any database whose name does
            # not start with `embroidery_db7_` — the rule that keeps fixtures out
            # of shared data (VALIDATION_GOVERNANCE §3A.4). This database is
            # disposable in fact (an `emptyDir`, destroyed with the cluster), so
            # it is named to say so, and the guard does its job instead of being
            # argued with.
            - { name: POSTGRES_DB, value: embroidery_db7_h02_staging }
            - { name: POSTGRES_USER, value: embroidery }
            - name: POSTGRES_PASSWORD
              valueFrom:
                { secretKeyRef: { name: embroidery-staging-postgres, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: TZ, value: UTC }
          readinessProbe:
            # `APP12-E01` §3.3 / `FU-APP12-H07-02` — the probe names the database
            # this server actually creates. It used to ask for `embroidery`,
            # which `POSTGRES_DB` above has never been, so every five seconds for
            # the life of the pod the server logged
            # `FATAL: database "embroidery" does not exist`. The probe still
            # passed — `pg_isready` reports a reachable server even when the
            # connection is rejected — so the only effect was to fill the log an
            # operator reads during a staging incident with a failure that was
            # not one. Written against the same env values rather than repeated
            # as literals, so the two cannot drift apart again.
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: tls, mountPath: /etc/postgres-tls, readOnly: true }
      # emptyDir, never a PVC: this database is disposable by design and a
      # persistent claim would advertise a durability this makes no claim to.
      # PostgreSQL refuses to start if its private key is group- or
      # world-readable. A projected Secret is owned by root, so `0640` with the
      # container's group is the mode it accepts.
      securityContext: { fsGroup: 70 }
      volumes:
        - { name: data, emptyDir: {} }
        - name: tls
          secret: { secretName: embroidery-staging-postgres-tls, defaultMode: 0640 }
