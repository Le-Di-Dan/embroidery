# The business API (NestJS). Stateless, replicated, fronted by a Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embroidery-api
  labels: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: api }
  strategy:
    type: RollingUpdate
    # Never fewer healthy pods than the current replica count during a rollout,
    # and never more than one extra: a bad revision cannot take the API down
    # because the old pods are only removed once the new ones report ready.
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: api }
    spec:
      # Graceful drain (`APP12-H04-C1` §4). `APP12-H04` measured three connection
      # resets per replica roll: the container gets SIGTERM and stops accepting
      # connections at the same instant kubelet *begins* removing it from
      # Endpoints, and the Gateway keeps sending traffic until that removal has
      # propagated. Nothing the process does can close that window on its own,
      # because the process is not the thing holding the stale route.
      #
      # 45s = the preStop delay, plus room for the longest in-flight request to
      # finish, plus margin. It bounds the whole drain; it is not a guess about
      # how long shutdown takes.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          # Replaced per overlay with an immutable digest/SHA reference. The
          # literal tag here is a placeholder the kustomize `images:` transformer
          # overwrites; no overlay may resolve to `latest`.
          image: embroidery/api:REPLACED_BY_OVERLAY
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 4000 }
            # APP12-H03 §10 — the internal metrics listener. Declared so the
            # metrics Service can target it by name; NOT a probe target, and no
            # HTTPRoute references it.
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef: { name: embroidery-config }
            # No `optional: true`, deliberately: a missing Secret must leave the
            # pod unschedulable rather than start the API with no database URL,
            # no envelope key and no peppers.
            - secretRef: { name: embroidery-secrets }
          # Liveness is process health only — it must not depend on the
          # database, or a brief database blip would restart every API pod and
          # turn a recoverable incident into a crash loop.
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness DOES depend on the database: `/api/health/readiness`
          # answers 503 when the pool is down, which is exactly when this
          # instance should leave rotation without being killed.
          readinessProbe:
            httpGet: { path: /api/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup is where a slow first boot is tolerated (bucket verification
          # runs before the server listens), so liveness can stay aggressive.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          # The first half of the drain (`APP12-H04-C1` §4). `preStop` runs
          # BEFORE SIGTERM is delivered, and the container keeps serving
          # normally throughout — so this is not a pause, it is the interval in
          # which endpoint removal reaches the Gateway while this pod is still
          # able to answer.
          #
          # `exec: sleep` rather than the newer `lifecycle.preStop.sleep` field:
          # the sleep action is only GA from Kubernetes 1.32, and the production
          # distribution is an open decision (`CLAUDE.md` §8), so the portable
          # form is the correct one. `sleep` is busybox's, present in the Alpine
          # runtime image this container already runs.
          #
          # 10s covers readiness failing (period 10s) plus the Gateway's own
          # reconfiguration, and sits well inside the 45s grace period. It is
          # measured, not arbitrary: §I records three rollout cycles at load.
          lifecycle:
            preStop:
              exec: { command: ['sleep', '10'] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      # `readOnlyRootFilesystem` needs a writable /tmp; an emptyDir keeps it
      # per-pod and non-persistent.
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: embroidery-api
  labels: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: api }
spec:
  selector: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 4000, targetPort: http }]
---
# The metrics-only Service (`APP12-H03` §10, §18).
#
# A second Service over the same pods, publishing port 9464 and nothing else.
# Two properties follow, and both are the point:
#
#   * Prometheus discovers it by name and scrapes **each pod individually**
#     through endpoint discovery, which is the only correct way to read a
#     per-process counter from a two-replica Deployment;
#   * no HTTPRoute references it, so the Gateway has no path to it at all. The
#     §18 denial is a property of the topology, not of a rule.
apiVersion: v1
kind: Service
metadata:
  name: embroidery-api-metrics
  labels:
    app.kubernetes.io/name: embroidery
    app.kubernetes.io/component: api
    embroidery.local/monitoring: 'true'
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: api }
  ports: [{ name: metrics, port: 9464, targetPort: metrics }]
