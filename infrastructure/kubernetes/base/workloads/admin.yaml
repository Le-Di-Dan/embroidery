# The admin (Next.js standalone). Stateless, replicated, fronted by a Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embroidery-admin
  labels: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: admin }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: admin }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: admin }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: admin
          image: embroidery/admin:REPLACED_BY_OVERLAY
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: embroidery-config }
          # Both Next apps serve `/healthz` from the app itself, never under
          # `/api/*`. It reaches no downstream dependency, so the same endpoint
          # is honest as liveness and as readiness: this process either serves
          # HTTP or it does not.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 640Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Next writes its runtime cache under `.next/cache`; with a
            # read-only root filesystem that path has to be a volume or the
            # server dies on its first render.
            - { name: next-cache, mountPath: /app/apps/admin/.next/cache }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: embroidery-admin
  labels: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: admin }
spec:
  selector: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: admin }
  ports: [{ name: http, port: 3001, targetPort: http }]
