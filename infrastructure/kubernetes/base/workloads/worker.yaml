# The asynchronous worker (NestJS application context).
#
# It publishes no **business** HTTP surface and has no HTTP probe. That remains
# deliberate rather than missing: `APP12-H02` §9 forbids inventing an HTTP
# worker endpoint solely to satisfy a Kubernetes probe, and the worker's health
# contract is still process liveness — a fatal handler calls `process.exit(1)`
# and the container is restarted by the kubelet. A real liveness endpoint
# arrives with the queue/broker decision (open decision IMP-O003), which owns
# what "the worker is working" even means.
#
# `APP12-H03` §10 adds an internal **metrics** listener on port 9464, and it is
# not the endpoint H02 refused. It is not a probe target, no probe references
# it, and a failure to bind it is logged and stepped over rather than failing
# the process — the worker's liveness semantics are byte-for-byte unchanged. It
# exists because a process with no HTTP surface still has to be scrapeable, and
# the alternative was inventing a business API for it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embroidery-worker
  labels: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: worker }
spec:
  # One replica, deliberately. The delivered worker claims jobs without a
  # broker; a second replica would be a concurrency decision IMP-O003 has not
  # taken, not a capacity win.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: worker }
  strategy:
    # Recreate, not RollingUpdate: with one claiming process and no broker, an
    # overlapping old and new pod is exactly the double-claim the queue decision
    # has not yet made safe.
    type: Recreate
  template:
    metadata:
      labels: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # The worker finishes the job it holds before it goes; the kubelet waits
      # this long before SIGKILL.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: embroidery/worker:REPLACED_BY_OVERLAY
          imagePullPolicy: IfNotPresent
          ports:
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef: { name: embroidery-config }
            - secretRef: { name: embroidery-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
# The worker's metrics-only Service (`APP12-H03` §10, §18).
#
# The worker's ONLY Service, and it publishes only port 9464. Nothing routes to
# it and nothing probes it.
apiVersion: v1
kind: Service
metadata:
  name: embroidery-worker-metrics
  labels:
    app.kubernetes.io/name: embroidery
    app.kubernetes.io/component: worker
    embroidery.local/monitoring: 'true'
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: embroidery, app.kubernetes.io/component: worker }
  ports: [{ name: metrics, port: 9464, targetPort: metrics }]
