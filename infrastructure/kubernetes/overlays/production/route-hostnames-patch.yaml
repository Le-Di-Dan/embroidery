# The canonical hostnames, as external release values.
#
# Empty rather than invented: `APP12-H02` §24 forbids naming a production brand
# domain and calling it production truth, and §44 keeps the real domain outside
# Git by design. The release preflight refuses a deploy that still reads empty.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embroidery-storefront
spec:
  hostnames: []
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embroidery-admin
spec:
  hostnames: []
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embroidery-https-redirect
spec:
  hostnames: []
