# Staging-only: mint the synthetic operator the Admin smoke signs in as.
#
# Staging only, deliberately. In production all three `STAFF_BOOTSTRAP_*` values
# are optional and a missing password skips bootstrap (exit 0) and mutates
# nothing, so the base has no such Job: production operator provisioning is an
# operator action, not a side effect of a deploy.
#
# The credential is synthetic, generated per run and destroyed with the cluster.
# No shared production staff password is ever requested or read (§25).
#
# `APP12-H03-C1` gave this Job a second responsibility: the same CLI publishes
# `worker.runtime`, the policy every worker reads at startup and which nothing
# published before. That is why a cold staging cluster now has an ACTIVE worker
# rather than one that is Ready and claims nothing. Nothing about the ordering
# is guaranteed — Kubernetes starts this Job and the worker Deployment
# concurrently — and nothing needs to be: the worker re-reads the policy on its
# own recheck interval while it has none, and adopts the first valid one.
#
# Production applies the equivalent by hand
# (`infrastructure/kubernetes/operator/staff-bootstrap-job.yaml`).
apiVersion: batch/v1
kind: Job
metadata:
  name: embroidery-staff-bootstrap
  labels: { app.kubernetes.io/component: staff-bootstrap, embroidery.local/disposable: 'true' }
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app.kubernetes.io/component: staff-bootstrap, embroidery.local/disposable: 'true' }
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: staff-bootstrap
          image: embroidery/api:REPLACE_WITH_IMMUTABLE_RELEASE_REF
          command: ['node', '/app/apps/api/dist/cli/staff-bootstrap.js']
          envFrom:
            - configMapRef: { name: embroidery-config }
            - secretRef: { name: embroidery-secrets }
            - secretRef: { name: embroidery-staff-bootstrap }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
