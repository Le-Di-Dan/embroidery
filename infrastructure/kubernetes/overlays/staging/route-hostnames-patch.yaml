# Test-controlled staging hostnames. The Storefront origin here is the SAME
# value `STOREFRONT_PUBLIC_ORIGIN` carries, so a secure link the worker mints
# resolves to the host this Gateway actually serves (§28).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embroidery-storefront
spec:
  hostnames: ['staging.embroidery.local']
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embroidery-admin
spec:
  hostnames: ['admin.staging.embroidery.local']
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embroidery-https-redirect
spec:
  hostnames: ['staging.embroidery.local', 'admin.staging.embroidery.local']
