# Prometheus (`APP12-H03` §4, §18, §19).
#
# One replica, one emptyDir, no persistent claim. Storage is deliberately
# ephemeral here: `SYSTEM_ARCHITECTURE.md` §13 reserves stateful topology to an
# ADR, and inventing a PersistentVolumeClaim for the monitoring plane would take
# the same decision H02 declined to take for PostgreSQL. Production persistence
# is a release input, not a value this file may choose:
#
#     RELEASE_INPUT: monitoring_persistence = REQUIRED_BEFORE_R01
#
# Losing the metrics history on a pod restart is an acceptable staging property
# and is *not* an acceptable production one — which is exactly why it is named
# as a release input rather than quietly shipped.
#
# ## No Ingress, no HTTPRoute, no NodePort
#
# The Service is `ClusterIP` and nothing routes to it. That is the §18 denial:
# the Prometheus UI is unreachable from the customer or Admin Gateway because
# there is no path to it, not because a rule forbids it. An operator reaches it
# with `kubectl port-forward`, which §4 explicitly permits for staging.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: embroidery-prometheus
  labels:
    app.kubernetes.io/name: embroidery-monitoring
    app.kubernetes.io/component: prometheus
---
# Endpoint discovery needs to read Services, Endpoints and Pods. Read-only, and
# scoped to one namespace with a Role rather than a ClusterRole: Prometheus
# discovers only this application's own namespace (`own_namespace: true`), so a
# cluster-wide grant would be authority it never uses.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: embroidery-prometheus
  labels:
    app.kubernetes.io/name: embroidery-monitoring
    app.kubernetes.io/component: prometheus
rules:
  - apiGroups: ['']
    resources: ['services', 'endpoints', 'pods']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['discovery.k8s.io']
    resources: ['endpointslices']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: embroidery-prometheus
  labels:
    app.kubernetes.io/name: embroidery-monitoring
    app.kubernetes.io/component: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: embroidery-prometheus
subjects:
  - kind: ServiceAccount
    name: embroidery-prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embroidery-prometheus
  labels:
    app.kubernetes.io/name: embroidery-monitoring
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: embroidery-monitoring
      app.kubernetes.io/component: prometheus
  strategy:
    # A second Prometheus writing the same emptyDir is not possible, and two
    # scraping the same targets would double every alert.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embroidery-monitoring
        app.kubernetes.io/component: prometheus
      annotations:
        # Forces a rollout when the rules or the scrape config change. Without
        # it, `kubectl apply` updates the ConfigMap and the running pod keeps
        # evaluating the old rules — silently, for as long as it lives.
        embroidery.local/config-generation: '1'
    spec:
      serviceAccountName: embroidery-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Bounded twice: by time and by size. The size bound is what stops a
            # runaway cardinality incident from filling the node's disk, which
            # would take the applications down with it.
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=2GB
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules }
            - { name: data, mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
      volumes:
        - name: config
          configMap: { name: embroidery-prometheus-config }
        - name: rules
          configMap: { name: embroidery-prometheus-rules }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: embroidery-prometheus
  labels:
    app.kubernetes.io/name: embroidery-monitoring
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: embroidery-monitoring
    app.kubernetes.io/component: prometheus
  ports:
    - { name: http, port: 9090, targetPort: http }
