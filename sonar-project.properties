# SonarQube scanner configuration for the Embroidery Commerce monorepo.
# Authentication token is provided via the SONAR_TOKEN environment variable —
# never store it in this file. See docs/development/LOCAL_DEVELOPMENT.md.

sonar.projectKey=embroidery-commerce
sonar.projectName=Embroidery Commerce Platform

sonar.sources=apps,packages,tools
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.test.mjs

# Generated and third-party output must not be analyzed
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/.turbo/**,**/*.d.ts

# Coverage (lcov reports produced by `pnpm test:coverage`)
sonar.javascript.lcov.reportPaths=apps/storefront/coverage/lcov.info,apps/admin/coverage/lcov.info,apps/api/coverage/lcov.info,apps/worker/coverage/lcov.info,packages/contracts/coverage/lcov.info,packages/api-client/coverage/lcov.info
sonar.coverage.exclusions=**/*.config.*,**/jest.config.*,tools/**

sonar.sourceEncoding=UTF-8
